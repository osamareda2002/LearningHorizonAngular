<div class="books-container" [class.sidebar-open]="isSidebarOpen">
  <!-- Sidebar -->
  <app-sidebar [isAdmin]="isAdmin" (close)="toggleSidebar()"></app-sidebar>

  <div class="sidebar-overlay" (click)="toggleSidebar()"></div>

  <!-- Main Content -->
  <main class="main-content">
    <!-- Navbar -->
    <div class="user-navbar">
      <div class="navbar-left">
        <button class="menu-toggle-btn" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <button
          *ngIf="viewMode === 'books'"
          class="btn-back"
          (click)="goBackToCategories()"
          title="Back to Categories"
        >
          <i class="bi bi-arrow-left"></i>
        </button>
        <h2 class="page-title">
          {{ viewMode === 'categories' ? 'Books' : selectedCategory?.title || 'Books' }}
        </h2>
      </div>
      <div class="user-menu">
        <span class="user-name">{{ userName }}</span>
        <div class="dropdown">
          <button class="dropdown-toggle" (click)="toggleDropdown()">
            <i class="bi bi-chevron-down"></i>
          </button>
          <div class="dropdown-menu" [class.show]="isDropdownOpen">
            <a *ngIf="!isLoggedIn" (click)="handleAuth()">Login</a>
            <a *ngIf="isLoggedIn" (click)="handleAuth()">Logout</a>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== CATEGORIES VIEW ==================== -->
    <div *ngIf="viewMode === 'categories'" class="categories-section">
      <div *ngIf="loadingCategories" class="loading-state">
        <i class="bi bi-hourglass-split"></i>
        <p>Loading categories...</p>
      </div>

      <div *ngIf="!loadingCategories && categories.length === 0" class="no-items">
        <i class="bi bi-inbox"></i>
        <p>No categories found</p>
      </div>

      <div *ngIf="!loadingCategories && categories.length > 0" class="categories-grid">
        <div
          *ngFor="let cat of categories"
          class="category-card"
          (click)="selectCategory(cat)"
        >
          <div class="category-image">
            <img [src]="cat.imageUrl" [alt]="cat.title" />
          </div>
          <div class="category-info">
            <h3 class="category-name">{{ cat.title }}</h3>
            <p class="category-desc" *ngIf="cat.about">{{ cat.about }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- ==================== BOOKS VIEW ==================== -->
    <div *ngIf="viewMode === 'books'" class="books-section">
      <!-- Search -->
      <div class="search-section">
        <div class="search-box">
          <i class="bi bi-search"></i>
          <input
            type="text"
            [(ngModel)]="searchQuery"
            (ngModelChange)="onSearch()"
            placeholder="Search books in {{ selectedCategory?.title }}..."
          />
        </div>
      </div>

      <!-- Loading -->
      <div *ngIf="loadingBooks" class="loading-state">
        <div class="spinner"></div>
        <p>Loading books...</p>
      </div>

      <!-- Empty -->
      <div *ngIf="!loadingBooks && filteredBooks.length === 0" class="no-items">
        <i class="bi bi-book"></i>
        <p>No books found in this category</p>
      </div>

      <!-- Books Grid -->
      <div *ngIf="!loadingBooks && filteredBooks.length > 0" class="books-grid">
        <div class="book-card" *ngFor="let book of filteredBooks">
          <div class="book-cover">
            <img [src]="book.posterLink" [alt]="book.title" />
          </div>
          <div class="book-info">
            <h3 class="book-title">{{ book.title }}</h3>
            <p class="book-description" *ngIf="book.description">{{ book.description }}</p>
          </div>
          <div class="book-footer">
            <button class="btn-visit" (click)="visitBook(book)">
              <i class="bi bi-box-arrow-up-right"></i>
              Visit
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
